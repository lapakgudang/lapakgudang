<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StokKu ERP</title>
<style>
:root{--pri:#1769e0;--pri-d:#0f4fb0;--side:#0f1d36;--side2:#16294a;--bg:#f3f5f9;--card:#fff;--line:#e6e9f0;--tx:#1e2430;--mut:#7b8494;--ok:#14a05a;--warn:#e69a0c;--bad:#d93a3a;
--acc-l:#4b95ff;--on-pri:#fff;--ring:#bcd4fa;--side-line:#1d2f52;--side-tx:#cfd8ea;--side-tx2:#6f7f9f;--side-hi:#fff;--bd:#d5dae3;--inbg:#fff;--head:#f7f9fc;--hov:#f8fafe;--tx2:#4a5262;--scan-bg:#f4f8ff;--sumbg:#eaf1fd;--sumtx:#1b4fa3;--faint:#c3c9d4}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--tx);background:var(--bg)}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit}
input,select,textarea{height:36px;border:1px solid var(--bd);border-radius:6px;padding:0 10px;background:var(--inbg);color:var(--tx);width:100%}
textarea{height:64px;padding:8px 10px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ring);border-color:var(--pri)}
input[readonly]{background:var(--head);color:#566}
label{display:flex;flex-direction:column;gap:5px;color:var(--tx2);font-size:13px}
.btn{height:36px;padding:0 16px;border-radius:6px;border:1px solid var(--bd);background:var(--inbg);cursor:pointer;white-space:nowrap;color:var(--tx)}
.btn:hover{background:var(--hov)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}.btn.pri:hover{background:var(--pri-d)}
.btn.sm{height:28px;padding:0 10px;font-size:12px}
.btn.del{color:var(--bad)}
.btn:disabled{opacity:.6;cursor:wait}
/* login */
#login{min-height:100vh;display:flex;background:linear-gradient(135deg,var(--side),var(--pri));position:relative;overflow:hidden}
#login::before,#login::after{content:"";position:absolute;border-radius:50%;pointer-events:none;background:rgba(255,255,255,.06)}
#login::before{width:520px;height:520px;left:-160px;bottom:-200px}
#login::after{width:340px;height:340px;left:32%;top:-140px}
.lleft{flex:1.15;display:flex;align-items:center;justify-content:center;padding:40px;position:relative;z-index:1}
.lplate{width:100%;max-width:560px}
.lplate img{display:block;width:100%;height:auto;max-height:46vh;object-fit:contain;filter:drop-shadow(0 6px 24px rgba(0,0,0,.35))}
.lplate img.lw{filter:brightness(0) invert(1) drop-shadow(0 6px 24px rgba(0,0,0,.35))}
.lplate.card{background:#fff;border-radius:22px;padding:32px 40px;box-shadow:0 24px 70px rgba(0,0,0,.35)}
.lplate.card img{filter:none}
.lright{flex:1;display:flex;align-items:center;justify-content:center;padding:24px 56px 24px 16px;position:relative;z-index:1}
.lbox{background:var(--card);border-radius:12px;padding:32px;width:100%;max-width:400px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.pw{position:relative}.pw input{padding-right:42px}.pwb{position:absolute;right:2px;top:0;height:36px;width:38px;border:0;background:none;color:var(--mut);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}.pwb:hover,.pwb:focus-visible{color:var(--pri)}
.cap{display:flex;align-items:center;gap:8px}
.cap canvas{border:1px solid var(--bd);border-radius:6px;background:#eef3fb;height:44px;width:150px;flex-shrink:0;user-select:none}
.cap .btn{height:44px;width:44px;padding:0;font-size:18px}
@media(max-width:900px){
 #login{flex-direction:column}
 .lleft{flex:none;padding:32px 24px 4px}.lplate{max-width:280px}.lplate.card{padding:16px 22px;border-radius:16px}
 .lright{padding:20px 16px 32px}
}
.brand{font-size:24px;font-weight:700;color:var(--pri);margin-bottom:4px}
.lbox form{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.err{color:var(--bad);margin:0;min-height:18px;font-size:13px}
.demo{margin-top:18px;padding:12px;background:var(--head);border-radius:8px;font-size:12px;color:var(--tx2)}
.demo b{display:block;margin-bottom:6px}
.demo span{display:inline-block;margin:2px 4px 2px 0;padding:3px 9px;border-radius:12px;background:var(--card);border:1px solid var(--bd);cursor:pointer;color:var(--pri)}
.demo.demo2{background:none;padding:0;margin-top:18px;font-size:12.5px}
.demo2 .dmsep{display:flex;align-items:center;gap:10px;margin-bottom:12px;color:var(--mut);font-size:12px}
.demo2 .dmsep:before,.demo2 .dmsep:after{content:"";flex:1;height:1px;background:var(--line)}
.demo2 .dmsep small{font-size:12px}
.demo2 .dmb{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.demo2 .btn.dm{height:auto;min-height:38px;padding:6px 8px;font-size:13px;font-weight:600;line-height:1.15;white-space:normal;color:var(--pri);border-color:var(--pri);background:var(--card)}
.demo2 .btn.dm{border-color:color-mix(in srgb,var(--pri) 45%,var(--card));background:color-mix(in srgb,var(--pri) 8%,var(--card))}
.demo2 .btn.dm:hover{background:var(--pri);border-color:var(--pri);color:var(--on-pri)}
.demo2 .btn.dm:disabled{opacity:.5;cursor:default}
.demo2 .dmn{margin-top:10px;text-align:center;color:var(--mut);line-height:1.4}
#demoBar{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;padding:8px 16px;background:#fff4d6;color:#6b4700;border-bottom:1px solid #f0d58a;font-size:13px;text-align:center}
#demoBar .btn{height:28px;padding:0 12px;background:#fff;color:#6b4700;border-color:#e6c978}
.link{background:none;border:0;color:var(--pri);cursor:pointer;padding:0;margin-top:12px;font-size:13px}
/* shell */
#shell{display:flex;height:100vh}
aside{width:224px;background:var(--side);color:var(--side-tx);display:flex;flex-direction:column;flex-shrink:0;overflow:auto}
aside .logo{height:58px;display:flex;align-items:center;padding:0 22px;font-size:19px;font-weight:700;color:var(--side-hi);gap:10px;border-bottom:1px solid var(--side-line)}
aside .grp{padding:16px 22px 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--side-tx2)}
aside a{display:flex;align-items:center;gap:12px;padding:10px 22px;color:var(--side-tx);text-decoration:none;cursor:pointer;border-left:3px solid transparent}
aside a:hover{background:var(--side2)}
aside a.on{background:var(--side2);color:var(--side-hi);border-left-color:var(--acc-l)}
aside a i{font-style:normal;width:18px;text-align:center}
main{flex:1;display:flex;flex-direction:column;min-width:0}
header{height:58px;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 22px}
header h1{font-size:17px;margin:0;flex:1}
#burger{display:none;border:0;background:none;font-size:22px;cursor:pointer}
.chip{display:inline-block;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:600}
.c-ok{background:#dcf5e8;color:#0b7a42}.c-warn{background:#fdf0d2;color:#946200}.c-bad{background:#fbe0e0;color:#a52222}
.c-in{background:#dcf5e8;color:#0b7a42}.c-out{background:#fde4d3;color:#a8480b}.c-gray{background:#eceff5;color:#556}
.u{text-align:right;line-height:1.2}.u small{color:var(--mut)}
#view{flex:1;overflow:auto;padding:20px 22px}
.card{background:var(--card);border-radius:10px;border:1px solid var(--line);padding:18px;margin-bottom:18px}
.card h3{margin:0 0 14px;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.stat small{color:var(--mut)}.stat div{font-size:26px;font-weight:700;margin-top:4px}
.stat div.sm{font-size:20px;padding-top:4px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.bar{display:flex;gap:10px;align-items:flex-end;height:140px}
.bar>div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.bar .pair span{width:42%;border-radius:3px 3px 0 0;min-height:2px}
.bar small{color:var(--mut);font-size:11px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;margin-bottom:14px}
.filters label{min-width:170px;flex:1;max-width:260px}
.filters .chk{flex-direction:row;align-items:center;gap:8px;min-width:auto;flex:none;height:36px}
.filters .chk input{width:auto;height:auto}
.ck{flex-direction:row;align-items:center;gap:8px;height:36px}
.ck input{width:auto;height:auto}
.sp{flex:1}
.tw{overflow:auto;border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{background:var(--head);font-weight:600;color:var(--tx2);font-size:13px}
tbody tr:hover td{background:var(--hov)}
tbody tr:last-child td{border-bottom:0}
tfoot td{background:var(--head);border-top:1px solid var(--line);border-bottom:0}
td.num,th.num{text-align:right}
.empty{padding:30px;text-align:center;color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:16px}
.lines td{padding:6px 8px}.lines th{padding:8px}
.lines input,.lines select{height:30px}
.lines td input.px{width:130px;text-align:right}
.lines td input.qy{width:90px;text-align:right}
.hint{color:var(--mut);font-size:12px}
.right{display:flex;justify-content:flex-end;gap:10px;margin-top:14px}
dialog{border:0;border-radius:12px;padding:24px;width:min(460px,94vw);box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:92vh}
dialog.wide{width:min(780px,96vw)}
dialog::backdrop{background:rgba(10,20,40,.5)}
dialog h3{margin:0 0 16px}
dialog .f{display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:99}
#toast div{background:#1e2430;color:#fff;padding:10px 16px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast div.bad{background:var(--bad)}
.scanbox{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin-bottom:8px}
#scan{height:46px;font-size:18px;border:2px solid var(--pri);background:var(--scan-bg)}
.scanmsg{min-height:22px;margin:4px 0 12px;font-weight:600;color:var(--mut)}
.scanmsg.ok{color:var(--ok)}.scanmsg.bad{color:var(--bad)}
.sum{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.sum .chip{background:var(--sumbg);color:var(--sumtx)}
.snres{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px}
.snres dl{display:grid;grid-template-columns:150px 1fr;gap:6px 12px;margin:10px 0 0}
.snres dt{color:var(--mut)}.snres dd{margin:0;word-break:break-all}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:var(--ok)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
@media(max-width:820px){.scanbox{grid-template-columns:1fr}}
@media(max-width:820px){
 aside{position:fixed;left:-240px;top:0;bottom:0;z-index:50;transition:left .2s}
 aside.open{left:0}
 #burger{display:block}.two{grid-template-columns:1fr}
}
.mg .ck{height:28px}.mg{margin:8px 0}.mg b{display:block;font-size:12px;color:var(--mut);margin-bottom:2px}
/* order */
.olrow{display:grid;grid-template-columns:1fr 90px auto;gap:8px;margin-bottom:8px;align-items:center}
.olrow .olh{grid-column:1/-1;margin-top:-4px}
/* sapaan & kalender */
.hero{display:grid;grid-template-columns:1fr 340px;gap:18px;align-items:stretch}
.welcome{display:flex;align-items:center;gap:18px}
.welcome .av{width:68px;height:68px;border-radius:50%;background:linear-gradient(135deg,var(--acc-l),var(--pri));color:var(--on-pri);font-size:28px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.welcome .wt{font-size:20px;font-weight:700}.welcome .ws{color:var(--mut);margin-top:3px}
.calh{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin-bottom:10px}.calh h3{margin:0}
.caln{display:flex;align-items:center;gap:6px}.caln b{min-width:110px;text-align:center;font-size:13px}
.calg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.calg small{color:var(--mut);padding:4px 0}
.calg span{padding:6px 0;border-radius:6px;font-size:13px}.calg span.o{color:var(--faint)}
.calg span.t{background:var(--pri);color:var(--on-pri);font-weight:700}
@media(max-width:800px){.hero{grid-template-columns:1fr}}
/* ---- tampilan & branding ---- */
aside .logo{position:sticky;top:0;z-index:1;background:var(--side);flex-shrink:0}
aside .logo img{max-height:44px;max-width:100%;object-fit:contain}
aside .logo.plate img{background:#fff;border-radius:8px;padding:5px 10px}
aside .logo span{min-width:0;overflow:hidden;font-size:15px;line-height:1.2;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.llogo{max-height:64px;max-width:220px;object-fit:contain;display:block;margin:0 auto 12px}
#lhead{text-align:center}
.brandbar{display:flex;align-items:center;gap:16px;border-left:4px solid var(--pri)}
.brandbar img{max-height:56px;max-width:180px;object-fit:contain}
.brandbar .bn{font-size:20px;font-weight:700}.brandbar .bt{color:var(--mut);margin-top:2px}
dialog{background:var(--card);color:var(--tx)}
.sws{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.sw{border:2px solid var(--bd);border-radius:10px;background:var(--card);padding:8px;cursor:pointer;color:var(--tx);display:flex;flex-direction:column;gap:5px}
.sw i{display:block;height:18px;border-radius:4px;box-shadow:inset 0 0 0 1px rgba(128,128,128,.35)}.sw span{font-size:12px;text-align:center}
.sw.on{border-color:var(--pri);box-shadow:0 0 0 3px var(--ring)}
.bdrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
.bdrow input[type=color]{padding:3px;cursor:pointer}
.bdlogo{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bdlogo .box{width:120px;height:72px;border:1px dashed var(--bd);border-radius:8px;display:flex;align-items:center;justify-content:center;background:var(--head);overflow:hidden}
.bdlogo .box img{max-width:100%;max-height:100%;object-fit:contain}
.pvbg{border-radius:10px;padding:26px 18px;background:linear-gradient(135deg,var(--side),var(--pri))}
.pvcard{background:var(--card);border-radius:10px;padding:18px;text-align:center}
.pvcard img{max-height:48px;max-width:160px;object-fit:contain;margin-bottom:8px}
.pvn{font-size:18px;font-weight:700;color:var(--pri)}.pvt{font-size:12px;color:var(--mut);margin-bottom:12px}
.pvi{height:26px;border:1px solid var(--bd);border-radius:6px;margin-bottom:8px;background:var(--inbg)}
.pvb{height:28px;line-height:28px;border-radius:6px;background:var(--pri);color:var(--on-pri);font-size:13px;font-weight:600}
.bdbtns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
html[data-mode=dark]{--bg:#0d1320;--card:#151d2e;--line:#25304a;--tx:#e7ebf3;--tx2:#b3bdd0;--mut:#8f9bb2;--bd:#32405c;--inbg:#0f1626;--head:#1a2438;--hov:#1b2640;--scan-bg:#13203a;--faint:#4a5670;color-scheme:dark}
html[data-mode=dark] .c-ok,html[data-mode=dark] .c-in{background:#12382a;color:#6fe0a5}
html[data-mode=dark] .c-warn{background:#3b2f10;color:#f2c14e}
html[data-mode=dark] .c-bad{background:#3d1b1b;color:#ff8f8f}
html[data-mode=dark] .c-out{background:#3d2514;color:#ffa66b}
html[data-mode=dark] .c-gray{background:#26304a;color:#b3bdd0}
html[data-mode=dark] .nota{background:#fff;padding:14px;border-radius:6px}
/* akun di header */
.acct{position:relative}
.acb{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--inbg);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.acct:hover .acb,.acct.open .acb,.acb:focus-visible{border-color:var(--pri);color:var(--pri)}
.acm{display:none;position:absolute;right:0;top:100%;padding-top:8px;z-index:60}
.acct:hover .acm,.acct.open .acm,.acct:focus-within .acm{display:block}
.acp{background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18);padding:12px;min-width:190px}
.acp .ai{display:flex;flex-direction:column;gap:2px;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.acp .ai small{color:var(--mut)}
/* jam */
.clk{text-align:right;line-height:1.25;white-space:nowrap}
.clk b{display:block;font-size:16px;font-variant-numeric:tabular-nums}
.clk small{color:var(--mut);font-size:12px}
@media(max-width:600px){.clk small{display:none}.clk b{font-size:14px}}
/* tab & paging stok */
.tabs{display:flex;gap:28px;border-bottom:1px solid var(--line);margin-bottom:16px}
.tabs button{background:none;border:0;padding:12px 6px;font-size:15px;cursor:pointer;color:var(--tx2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--pri)}.tabs button.on{color:var(--pri);border-bottom-color:var(--pri);font-weight:600}
.pg{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:14px;flex-wrap:wrap}
.pg button{min-width:30px;height:30px;border:1px solid var(--bd);background:var(--inbg);color:var(--tx);border-radius:4px;cursor:pointer;padding:0 6px}
.pg button.on{border-color:var(--pri);color:var(--pri);font-weight:700}.pg button:disabled{opacity:.4;cursor:default}
.pg select{width:auto;height:30px}
/* notifikasi */
.nf{position:relative}
.nfb{width:38px;height:38px;border-radius:50%;border:1px solid var(--bd);background:var(--inbg);color:var(--tx);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.nfb:hover,.nf.open .nfb,.nfb:focus-visible{border-color:var(--pri);color:var(--pri)}
.nfc{position:absolute;top:-5px;right:-5px;min-width:19px;height:19px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--card)}
.nfp{display:none;position:absolute;right:0;top:100%;margin-top:8px;z-index:60;width:min(360px,92vw);background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.nf.open .nfp{display:block}
.nfh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line)}
.nfl{max-height:min(420px,70vh);overflow:auto}
.nfi{display:flex;gap:10px;width:100%;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--tx);cursor:pointer;text-align:left}
.nfi:last-child{border-bottom:0}.nfi:hover{background:var(--hov)}
.nfi .dot{width:8px;height:8px;border-radius:50%;background:var(--pri);margin-top:6px;flex-shrink:0}
.nfi.rd .dot{background:transparent}.nfi.rd{opacity:.65}
.nfi b{display:block;font-size:13px}.nfi .d{display:block;font-size:12.5px;color:var(--tx2);word-break:break-word}.nfi small{color:var(--mut)}
@media(max-width:600px){.nfp{position:fixed;left:8px;right:8px;top:62px;width:auto;margin-top:0}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login" hidden>
  <div class="lleft"><div class="lplate"><img id="lLogo" alt="Logo"></div></div>
  <div class="lright">
  <div class="lbox">
    <div id="lhead"></div>
    <form id="loginForm">
      <label>Email<input type="email" name="email" required autocomplete="username"></label>

const normSn=s=>String(s||"").trim().toUpperCase().replace(/\s+/g,"");
const sid=sn=>String(sn).replace(/[\/\s]/g,"_");
const shortSn=sn=>(String(sn).match(/[A-Z]\d{8}$/)||[sn])[0];

const serialIn=(sn,l,meta)=>({id:sid(sn),sn,short:shortSn(sn),itemId:l.itemId,itemCode:l.itemCode,itemName:l.itemName,whId:l.whId,whName:l.whName,status:"in",inDate:meta.date,inDoc:meta.docNo,inParty:meta.party||"",outDate:"",outDoc:"",outParty:""});
const serialOut=(l,meta)=>({status:"out",outDate:meta.date,outDoc:meta.docNo,outParty:meta.party||""});

/* ---------- HPP: perhitungan biaya per (barang, gudang) ----------
   rec = {qty, value, layers:[{q,c}]}  -> layers = lapisan biaya (FIFO).
   method "avg"  : moving average (layer digabung jadi 1 dengan biaya rata-rata)
   method "fifo" : barang keluar mengambil layer tertua dulu
   Fungsi murni: dipakai sama persis oleh mode demo & Firestore.          */
function costStep(rec,l,method){
  const r2=x=>Math.round(x*100)/100,r4=x=>Math.round(x*10000)/10000,{fb,...base}=l;
  let L=rec.layers?rec.layers.map(x=>({...x})):(rec.qty>0?[{q:rec.qty,c:Number(fb)||0}]:[]); // data lama tanpa layer: pakai harga beli standar
  const sumQ=()=>L.reduce((a,x)=>a+x.q,0),sumV=()=>L.reduce((a,x)=>a+x.q*x.c,0);
  const have=sumQ(),q=l.qty;
  const fin=(qty,line)=>{L=L.map(x=>({q:x.q,c:r4(x.c)}));return{qty,value:r2(sumV()),layers:L,line}};
  if(l.type==="in"){
    const c=Number(l.unitCost)||0;
    L.push({q,c});
    if(method==="avg"){const n=sumQ();L=[{q:n,c:sumV()/n}]}
    else{
      L=L.reduce((a,x)=>{const t=a[a.length-1];if(t&&t.c===x.c)t.q+=x.q;else a.push({...x});return a},[]);
      while(L.length>200){const a=L.shift(),b=L[0];b.c=(a.q*a.c+b.q*b.c)/(a.q+b.q);b.q+=a.q}
    }
    return fin(have+q,{...base,unitCost:c,amount:r2(q*c),cogs:0});
  }
  if(q>have)return{qty:have-q,value:0,layers:L,line:base};
  const avgc=have?sumV()/have:0;let cost=0,need=q;
  if(method==="avg"){cost=avgc*q;L=have-q>0?[{q:have-q,c:avgc}]:[]}
  else while(need>0&&L.length){const f=L[0],t=Math.min(f.q,need);cost+=t*f.c;f.q-=t;need-=t;if(f.q<=0)L.shift()}
  return fin(have-q,{...base,cogs:r2(cost),unitCogs:r2(cost/q),amount:r2(q*(Number(l.price)||0))});
}
/* Penerimaan PO: validasi + update qty diterima + paksa harga sesuai PO */
function prepPo(po,lines){
  if(!po||["cancelled","received","closed"].includes(po.status))throw new Error("PO tidak bisa menerima barang (status: "+(po?po.status:"tidak ditemukan")+")");
  const L=po.lines.map(x=>({...x,received:x.received||0}));
  const out=lines.map(l=>{
    const t=L.find(x=>x.itemId===l.itemId);
    if(!t)throw new Error("Barang tidak ada di PO: "+l.itemName);
    t.received+=l.qty;
    if(t.received>t.qty)throw new Error("Melebihi qty PO: "+l.itemName);
    return{...l,unitCost:Number(t.price)||0};
  });
  return{po:{lines:L,status:L.every(x=>x.received>=x.qty)?"received":"partial"},lines:out};
}
/* Nota penjualan otomatis dari baris barang keluar */
function buildInvoice(lines,meta,o,ts){
  const ls=lines.filter(l=>l.type==="out").map(l=>({itemId:l.itemId,code:l.itemCode,name:l.itemName,qty:l.qty,price:Number(l.price)||0,amount:l.amount||0,sns:(l.sns||[]).map(shortSn)}));
  const subtotal=ls.reduce((a,x)=>a+x.amount,0),discount=Math.min(Math.max(Number(o.discount)||0,0),subtotal);
  const taxRate=Number(o.taxRate)||0,tax=Math.round((subtotal-discount)*taxRate/100),paid=o.pay!=="Tempo";
  return{no:"INV-"+meta.date.replace(/-/g,"")+"-"+rid().slice(0,4).toUpperCase(),date:meta.date,docNo:meta.docNo,customer:meta.party,ref:meta.ref||"",whName:lines[0].whName,
    lines:ls,subtotal,discount,taxRate,tax,total:subtotal-discount+tax,cogs:Math.round(lines.reduce((a,l)=>a+(l.cogs||0),0)*100)/100,
    pay:o.pay||"Tunai",status:paid?"paid":"unpaid",paidAt:paid?meta.date:"",note:meta.note||"",byName:meta.byName||"",createdAt:ts};
}
/* ---- Pindah gudang: barang keluar dari gudang asal + masuk ke gudang tujuan (nilai/HPP ikut pindah) ---- */
function planTransfer(L,from,to,meta,method,cur){
  const movs=[];
  L.forEach(l=>{
    const kf=l.itemId+"__"+from.id,kt=l.itemId+"__"+to.id;
    cur[kf]=cur[kf]||{itemId:l.itemId,whId:from.id,qty:0,value:0,layers:[]};
    cur[kt]=cur[kt]||{itemId:l.itemId,whId:to.id,qty:0,value:0,layers:[]};
    const base={itemId:l.itemId,itemCode:l.itemCode,itemName:l.itemName,qty:l.qty,sns:l.sns||[],fb:l.fb||0};
    const o=costStep(cur[kf],{...base,type:"out",whId:from.id,whName:from.name,price:0},method);
    if(o.qty<0)throw new Error(`Stok tidak cukup: ${l.itemName} di ${from.name}`);
    cur[kf]={...cur[kf],qty:o.qty,value:o.value,layers:o.layers};
    const i=costStep(cur[kt],{...base,type:"in",whId:to.id,whName:to.name,unitCost:o.line.unitCogs||0},method);
    cur[kt]={...cur[kt],qty:i.qty,value:i.value,layers:i.layers};
    movs.push({...meta,...o.line,party:"Pindah ke "+to.name},{...meta,...i.line,party:"Pindah dari "+from.name});
  });
  return movs;
}
function checkTransferSn(ex,sn,from){
  if(!ex||ex.status!=="in")throw new Error("SN tidak ada di stok: "+shortSn(sn));
  if(ex.whId!==from.id)throw new Error(`SN ${shortSn(sn)} ada di ${ex.whName}, bukan di ${from.name}`);
}
function applyTransfer(db,L,from,to,meta,ts){
  db.serials=db.serials||[];
  const seen=new Set();
  L.forEach(l=>(l.sns||[]).forEach(sn=>{
    if(seen.has(sn))throw new Error("SN dobel: "+shortSn(sn));seen.add(sn);
    checkTransferSn(db.serials.find(x=>x.id===sid(sn)),sn,from);
  }));
  const method=(db.settings&&db.settings.costMethod)||"avg",cur={};
  L.forEach(l=>[l.itemId+"__"+from.id,l.itemId+"__"+to.id].forEach(k=>{const x=db.stock.find(y=>y.id===k);if(x)cur[k]={...x}}));
  const movs=planTransfer(L,from,to,meta,method,cur);
  Object.entries(cur).forEach(([k,x])=>{x={...x,id:k};const i=db.stock.findIndex(y=>y.id===k);i<0?db.stock.push(x):db.stock[i]=x});
  L.forEach(l=>(l.sns||[]).forEach(sn=>Object.assign(db.serials.find(x=>x.id===sid(sn)),{whId:to.id,whName:to.name,moveDate:meta.date,moveDoc:meta.docNo})));
  movs.forEach((m,i)=>db.movements.push({...m,id:rid(),createdAt:ts+i}));
}
function applyPost(db,lines,meta,ts=Date.now(),extra={}){
  db.serials=db.serials||[];db.purchaseOrders=db.purchaseOrders||[];db.invoices=db.invoices||[];
  const seen=new Set();
  lines.forEach(l=>(l.sns||[]).forEach(sn=>{
    if(seen.has(sn))throw new Error("SN dobel: "+shortSn(sn));seen.add(sn);
    const ex=db.serials.find(s=>s.id===sid(sn));
    if(l.type==="in"){if(ex&&ex.status==="in")throw new Error("SN sudah ada di stok: "+shortSn(sn))}
    else{if(!ex||ex.status!=="in")throw new Error("SN tidak ada di stok: "+shortSn(sn));if(ex.whId!==l.whId)throw new Error(`SN ${shortSn(sn)} ada di ${ex.whName}`)}
  }));
  let poUp=null,poRef=null;
  if(extra.poId){poRef=db.purchaseOrders.find(p=>p.id===extra.poId);const r=prepPo(poRef,lines);lines=r.lines;poUp=r.po}
  const method=(db.settings&&db.settings.costMethod)||"avg",cur={};
  lines=lines.map(l=>({...l}));
  lines.forEach((l,i)=>{
    const k=l.itemId+"__"+l.whId;
    if(!cur[k]){const s=db.stock.find(x=>x.id===k);cur[k]=s?{...s}:{id:k,itemId:l.itemId,whId:l.whId,qty:0,value:0,layers:[]}}
    const r=costStep(cur[k],l,method);
    if(r.qty<0)throw new Error(`Stok tidak cukup: ${l.itemName} di ${l.whName}`);
    cur[k]={...cur[k],qty:r.qty,value:r.value,layers:r.layers};lines[i]=r.line;
  });
  Object.values(cur).forEach(s=>{const k=db.stock.findIndex(x=>x.id===s.id);k<0?db.stock.push(s):db.stock[k]=s});
  lines.forEach(l=>(l.sns||[]).forEach(sn=>{
    const id=sid(sn),k=db.serials.findIndex(s=>s.id===id);
    if(l.type==="in"){const rec=serialIn(sn,l,meta);k<0?db.serials.push(rec):db.serials[k]=rec}
    else Object.assign(db.serials[k],serialOut(l,meta));
  }));
  lines.forEach((l,i)=>db.movements.push({...meta,...l,id:rid(),createdAt:ts+i}));
  if(poUp)Object.assign(poRef,poUp);
  let invoice=null;
  if(extra.invoice){invoice={...buildInvoice(lines,meta,extra.invoice,ts),id:rid()};db.invoices.push(invoice)}
  return{invoice};
}

async function fbStore(){
  const V="10.12.2",G="https://www.gstatic.com/firebasejs/"+V+"/";
  const [A,AU,F]=await Promise.all([import(G+"firebase-app.js"),import(G+"firebase-auth.js"),import(G+"firebase-firestore.js")]);
  const app=A.initializeApp(firebaseConfig),auth=AU.getAuth(app),db=F.getFirestore(app);
  const prof=async u=>{
    const s=await F.getDoc(F.doc(db,"users",u.uid));
    if(!s.exists()){await AU.signOut(auth);throw new Error("Akun belum terdaftar di sistem. Hubungi admin.")}
    const p={id:u.uid,...s.data()};
    if(p.active===false){await AU.signOut(auth);throw new Error("Akun dinonaktifkan")}
    return p;
  };
  return {
    async list(c,w){
      const ref=F.collection(db,c);
      let q=["movements","invoices","purchaseOrders"].includes(c)?F.query(ref,F.orderBy("createdAt","desc"),F.limit(c==="movements"?1000:500)):ref;
      if(w)q=F.query(ref,F.where(w[0],"==",w[1]));
      return (await F.getDocs(q)).docs.map(d=>({id:d.id,...d.data()}));
    },
    async add(c,d){return (await F.addDoc(F.collection(db,c),d)).id},
    async addMany(c,arr){for(let i=0;i<arr.length;i+=400){const b=F.writeBatch(db);arr.slice(i,i+400).forEach(d=>b.set(F.doc(F.collection(db,c)),d));await b.commit()}},
    async set(c,id,d){await F.setDoc(F.doc(db,c,id),d,{merge:true})},
    async del(c,id){await F.deleteDoc(F.doc(db,c,id))},
    async getSettings(){const s=await F.getDoc(F.doc(db,"meta","settings"));return s.exists()?s.data():{}},
    async saveSettings(d){await F.setDoc(F.doc(db,"meta","settings"),d,{merge:true})},
    async getBranding(){const s=await F.getDoc(F.doc(db,"meta","branding"));return s.exists()?s.data():null},
    async saveBranding(d){await F.setDoc(F.doc(db,"meta","branding"),d)},
    watchStock(cb){return F.onSnapshot(F.collection(db,"stock"),sn=>cb(sn.docs.map(d=>({id:d.id,...d.data()}))),()=>{})},
    async getSerial(id){const s=await F.getDoc(F.doc(db,"serials",id));return s.exists()?{id:s.id,...s.data()}:null},
    async findSerial(raw){
      const out=new Map(),add=d=>out.set(d.id,{id:d.id,...d.data()}),c=F.collection(db,"serials");
      const s=await F.getDoc(F.doc(db,"serials",sid(raw)));if(s.exists())add(s);
      (await F.getDocs(F.query(c,F.where("short","==",shortSn(raw)),F.limit(20)))).docs.forEach(add);
      (await F.getDocs(F.query(c,F.where("sn",">=",raw),F.where("sn","<=",raw+""),F.limit(20)))).docs.forEach(add);
      return [...out.values()];
    },
    async post(lines,meta,extra={}){
      const res={invoice:null};
      await F.runTransaction(db,async tx=>{
        const ids=[...new Set(lines.map(l=>l.itemId+"__"+l.whId))];
        const poRef=extra.poId?F.doc(db,"purchaseOrders",extra.poId):null;
        const [snaps,setSnap,poSnap]=await Promise.all([
          Promise.all(ids.map(i=>tx.get(F.doc(db,"stock",i)))),
          tx.get(F.doc(db,"meta","settings")),
          poRef?tx.get(poRef):Promise.resolve(null)]);
        const sl=lines.flatMap(l=>(l.sns||[]).map(sn=>({l,sn})));
        const ssn=await Promise.all(sl.map(x=>tx.get(F.doc(db,"serials",sid(x.sn)))));
        const seen=new Set();
        sl.forEach((x,k)=>{
          if(seen.has(x.sn))throw new Error("SN dobel: "+shortSn(x.sn));seen.add(x.sn);
          const ex=ssn[k].exists()?ssn[k].data():null;
          if(x.l.type==="in"){if(ex&&ex.status==="in")throw new Error("SN sudah ada di stok: "+shortSn(x.sn))}
          else{if(!ex||ex.status!=="in")throw new Error("SN tidak ada di stok: "+shortSn(x.sn));if(ex.whId!==x.l.whId)throw new Error(`SN ${shortSn(x.sn)} ada di ${ex.whName}`)}
        });
        let L=lines,poUp=null;
        if(poRef){const r=prepPo(poSnap.exists()?{id:poSnap.id,...poSnap.data()}:null,L);L=r.lines;poUp=r.po}
        const method=(setSnap.exists()&&setSnap.data().costMethod)||"avg",cur={};
        ids.forEach((i,k)=>{const[itemId,whId]=i.split("__");cur[i]=snaps[k].exists()?{...snaps[k].data()}:{itemId,whId,qty:0,value:0,layers:[]}});
        L=L.map(l=>{
          const k=l.itemId+"__"+l.whId,r=costStep(cur[k],l,method);
          if(r.qty<0)throw new Error(`Stok tidak cukup: ${l.itemName} di ${l.whName}`);
          cur[k]={itemId:l.itemId,whId:l.whId,qty:r.qty,value:r.value,layers:r.layers};return r.line;
        });
        ids.forEach(i=>tx.set(F.doc(db,"stock",i),cur[i]));
        sl.forEach(x=>{const r=F.doc(db,"serials",sid(x.sn));x.l.type==="in"?tx.set(r,serialIn(x.sn,x.l,meta)):tx.set(r,serialOut(x.l,meta),{merge:true})});
        const ts=Date.now();
        L.forEach((l,i)=>tx.set(F.doc(F.collection(db,"movements")),{...meta,...l,createdAt:ts+i}));
        if(poUp)tx.set(poRef,poUp,{merge:true});
        if(extra.invoice){const inv=buildInvoice(L,meta,extra.invoice,ts),r=F.doc(F.collection(db,"invoices"));tx.set(r,inv);res.invoice={id:r.id,...inv}}
      });
      return res;
    },
    async transfer(L,from,to,meta){
      await F.runTransaction(db,async tx=>{
        const ids=[...new Set(L.flatMap(l=>[l.itemId+"__"+from.id,l.itemId+"__"+to.id]))];
        const sns=L.flatMap(l=>l.sns||[]);
        const [snaps,setSnap,ssn]=await Promise.all([
          Promise.all(ids.map(i=>tx.get(F.doc(db,"stock",i)))),
          tx.get(F.doc(db,"meta","settings")),
          Promise.all(sns.map(sn=>tx.get(F.doc(db,"serials",sid(sn)))))]);
        const seen=new Set();
        sns.forEach((sn,k)=>{
          if(seen.has(sn))throw new Error("SN dobel: "+shortSn(sn));seen.add(sn);
          checkTransferSn(ssn[k].exists()?ssn[k].data():null,sn,from);
        });
        const method=(setSnap.exists()&&setSnap.data().costMethod)||"avg",cur={};
        ids.forEach((i,k)=>{if(snaps[k].exists())cur[i]={...snaps[k].data()}});
        const movs=planTransfer(L,from,to,meta,method,cur);
        Object.entries(cur).forEach(([k,x])=>tx.set(F.doc(db,"stock",k),x));
        sns.forEach(sn=>tx.set(F.doc(db,"serials",sid(sn)),{whId:to.id,whName:to.name,moveDate:meta.date,moveDoc:meta.docNo},{merge:true}));
        const ts=Date.now();
        movs.forEach((m,i)=>tx.set(F.doc(F.collection(db,"movements")),{...m,createdAt:ts+i}));
      });
    },
    auth:{
      async restore(){await auth.authStateReady();return auth.currentUser?await prof(auth.currentUser).catch(()=>null):null},
      async login(e,p){return prof((await AU.signInWithEmailAndPassword(auth,e,p)).user)},
      async logout(){await AU.signOut(auth)},
      async createUser(d){
        // pakai instance kedua supaya admin tidak ikut logout
        const sec=A.initializeApp(firebaseConfig,"sec"+Date.now()),sa=AU.getAuth(sec);
        try{
          const c=await AU.createUserWithEmailAndPassword(sa,d.email,d.password);
          await F.setDoc(F.doc(db,"users",c.user.uid),{name:d.name,email:d.email,role:d.role,position:d.position||"",menus:d.menus||[],active:true});
        }finally{try{await AU.signOut(sa)}catch{}A.deleteApp(sec)}
      },
      async setupAdmin(d){
        const c=await AU.createUserWithEmailAndPassword(auth,d.email,d.password);
        try{
          const b=F.writeBatch(db);
          b.set(F.doc(db,"meta","bootstrap"),{at:Date.now(),by:c.user.uid});
          b.set(F.doc(db,"users",c.user.uid),{name:d.name,email:d.email,role:"admin",active:true});
          await b.commit();
        }catch(e){await AU.signOut(auth);throw new Error("Setup awal sudah pernah dilakukan. Login dengan akun yang ada.")}
        return prof(c.user);
      },
    },
  };
}

const BULAN=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

function calInner(){
  const now=new Date(),c=S.cal||(S.cal={y:now.getFullYear(),m:now.getMonth()});
  const first=new Date(c.y,c.m,1).getDay(),dim=new Date(c.y,c.m+1,0).getDate(),pdim=new Date(c.y,c.m,0).getDate();
  let cells="";
  for(let i=0;i<42;i++){
    let d=i-first+1,cls="";
    if(d<1){d+=pdim;cls="o"}else if(d>dim){d-=dim;cls="o"}
    else if(d===now.getDate()&&c.m===now.getMonth()&&c.y===now.getFullYear())cls="t";
    cells+=`<span class="${cls}">${d}</span>`;
  }
  return `<div class="calh"><h3>Kalender</h3><div class="caln"><button type="button" class="btn sm" data-a="calPrev">‹</button><b>${BULAN[c.m]} ${c.y}</b><button type="button" class="btn sm" data-a="calNext">›</button><button type="button" class="btn sm" data-a="calToday">Hari ini</button></div></div>
    <div class="calg">${HARI.map(h=>`<small>${h}</small>`).join("")}${cells}</div>`;
}

    h+=`<div class="stat"><small>Masuk Hari Ini</small><div>${nf(t.filter(m=>m.type==="in").reduce((a,m)=>a+m.qty,0))}</div></div>
        <div class="stat"><small>Keluar Hari Ini</small><div>${nf(t.filter(m=>m.type==="out").reduce((a,m)=>a+m.qty,0))}</div></div>`;
  }
  h+=`</div><div class="two">`;
  if(can("riwayat")){
    const days=[...Array(7)].map((_,i)=>daysAgo(6-i));
    const d=days.map(x=>({x,i:S.moves.filter(m=>m.date===x&&!m.transfer&&!m.adj&&m.type==="in").reduce((a,m)=>a+m.qty,0),o:S.moves.filter(m=>m.date===x&&!m.transfer&&!m.adj&&m.type==="out").reduce((a,m)=>a+m.qty,0)}));
    const mx=Math.max(1,...d.map(r=>Math.max(r.i,r.o)));
    h+=`<div class="card"><h3>Pergerakan 7 Hari Terakhir</h3><div class="bar">${d.map(r=>`<div title="Masuk ${r.i} / Keluar ${r.o}"><div class="pair"><span style="height:${r.i/mx*100}%;background:#14a05a"></span><span style="height:${r.o/mx*100}%;background:#e8741a"></span></div><small>${r.x.slice(8)}/${r.x.slice(5,7)}</small></div>`).join("")}</div>
      <div class="legend"><span><i style="background:#14a05a"></i>Masuk</span><span><i style="background:#e8741a"></i>Keluar</span></div></div>`;
  }
  h+=`<div class="card"><h3>Perlu Restock</h3>${low.length?`<div class="tw"><table><thead><tr><th>Barang</th><th class="num">Stok</th><th class="num">Min</th><th>Status</th></tr></thead><tbody>${low.slice(0,8).map(r=>`<tr><td>${esc(r.it.name)}</td><td class="num">${nf(r.qty)}</td><td class="num">${nf(r.it.min||0)}</td><td>${chipSt(r.st)}</td></tr>`).join("")}</tbody></table></div>`:'<div class="empty">Semua stok aman 👍</div>'}</div></div>`;
  if(can("riwayat")){
    h+=`<div class="card"><h3>Transaksi Terbaru</h3>${movTable(S.moves.slice(0,8),true)}</div>`;
  }
  return h;
};

const TRX={sns:[],plain:[],price:{},po:null};
const resetTrx=()=>{TRX.sns=[];TRX.plain=[];TRX.price={};TRX.po=null};
let AC;
function beep(ok){try{AC=AC||new AudioContext();const o=AC.createOscillator(),g=AC.createGain();o.connect(g);g.connect(AC.destination);o.frequency.value=ok?880:220;g.gain.value=.08;o.start();o.stop(AC.currentTime+(ok?.07:.3))}catch{}}
const normModel=s=>String(s||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
function detectItem(sn){
  const n=normModel(sn);let best=null;
  S.items.forEach(i=>{const m=normModel(i.model);if(m&&n.includes(m)&&(!best||m.length>normModel(best.model).length))best=i});
  return best;
}
const trxQty=id=>TRX.sns.filter(x=>x.itemId===id).length+TRX.plain.filter(x=>x.itemId===id).reduce((a,x)=>a+x.qty,0);
function poLimit(itemId,add){
  if(!TRX.po)return"";
  const l=TRX.po.lines.find(x=>x.itemId===itemId);
  if(!l)return"Barang ini tidak ada di "+TRX.po.no;
  const sisa=l.qty-(l.received||0)-trxQty(itemId);
  return add>sisa?`Melebihi qty PO ${TRX.po.no} (sisa ${nf(Math.max(sisa,0))})`:"";
}
function ensurePrice(id,type){
  const pl=TRX.po?.lines.find(x=>x.itemId===id);
  if(type==="in"&&pl){TRX.price[id]=Number(pl.price)||0;return}
  if(TRX.price[id]==null)TRX.price[id]=type==="in"?(IM[id]?.cost||0):(IM[id]?.price||0);
}
function trxItems(){
  const m=new Map();
  TRX.sns.forEach(x=>{const r=m.get(x.itemId)||{id:x.itemId,name:x.itemName,qty:0};r.qty++;m.set(x.itemId,r)});
  TRX.plain.forEach(p=>{const r=m.get(p.itemId)||{id:p.itemId,name:IM[p.itemId]?.name||"",qty:0};r.qty+=p.qty;m.set(p.itemId,r)});
  return [...m.values()];
}

/* Tambah 1 SN ke daftar. forced = barang yang dipilih manual (opsional) */
async function addSn(sn,forced){
  const f=$("#trx"),type=f.dataset.type,wh=f.wh.value,sh=shortSn(sn);
  if(TRX.sns.some(x=>x.sn===sn))return{msg:`SN ${sh} sudah ada di daftar ini`};
  const ex=await store.getSerial(sid(sn));let it;
  if(type==="out"){
    if(!ex||ex.status!=="in")return{msg:`SN ${sh} tidak ada di stok`};
    if(ex.whId!==wh)return{msg:`SN ${sh} ada di ${ex.whName}, bukan di gudang yang dipilih`};
    if(forced&&ex.itemId!==forced.id)return{msg:`SN ${sh} terdaftar sebagai ${ex.itemName}, bukan ${forced.name}`};
    it={id:ex.itemId,code:ex.itemCode,name:ex.itemName};
  }else{
    if(ex&&ex.status==="in")return{msg:`SN ${sh} sudah ada di stok (${ex.whName})`};
    it=forced||detectItem(sn)||IM[f.defItem.value];
    if(!it)return{msg:"Barang tidak terdeteksi dari barcode. Pilih barang di kolom 'Barang', lalu scan ulang"};
    const lim=poLimit(it.id,1);if(lim)return{msg:lim};
  }
  ensurePrice(it.id,type);
  TRX.sns.push({sn,short:sh,itemId:it.id,itemCode:it.code,itemName:it.name});
  return{ok:true,it,sh};
}
async function onScan(inp,noFocus){
  const sn=normSn(inp.value);
  inp.value="";if(!sn)return;
  const say=(m,ok)=>{const e=$("#scanMsg");e.textContent=m;e.className="scanmsg "+(ok?"ok":"bad");beep(ok)};
  try{
    const r=await addSn(sn);
    if(!r.ok)return say(r.msg);
    drawTrx();say(`✓ ${r.sh} → ${r.it.name}`,true);
  }catch(e){say(e.message)}
  if(!noFocus)inp.focus();
}
/* ---- Scan pakai kamera (HP / webcam): BarcodeDetector bawaan browser, cadangan html5-qrcode ---- */
let CAM=null;
const loadScript=src=>new Promise((res,rej)=>{const e=document.createElement("script");e.src=src;e.onload=res;e.onerror=()=>rej(new Error("Library scanner gagal dimuat (cek internet)"));document.head.append(e)});
function camClose(){if(!CAM)return;const c=CAM;CAM=null;try{c.stop?.()}catch{}c.ov.remove()}
function camHit(raw){
  if(!CAM)return;
  const sn=normSn(raw||"");if(!sn)return;
  const now=Date.now();if(CAM.last===sn&&now-CAM.t<4000)return;
  CAM.last=sn;CAM.t=now;
  const inp=$("#scan");if(!inp)return camClose();
  inp.value=sn;navigator.vibrate?.(40);
  onScan(inp,true).then(()=>{const m=$("#scanMsg"),e=$("#camMsg");if(m&&e){e.textContent=m.textContent;e.style.color=m.classList.contains("ok")?"#4ade80":"#f87171"}});
}
async function camOpen(){
  if(CAM||!$("#scan"))return;
  if(!navigator.mediaDevices?.getUserMedia)return toast("Kamera butuh HTTPS dan browser terbaru. Buka web lewat https://",true);
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;z-index:9999;background:#000;display:flex;flex-direction:column";
  ov.innerHTML=`<div id="camBox" style="position:relative;flex:1;min-height:0;width:100%;overflow:hidden"></div>
    <div style="padding:12px 14px calc(12px + env(safe-area-inset-bottom,0px));background:#111;color:#fff">
      <div id="camMsg" style="min-height:22px;font-weight:600">Arahkan kamera ke barcode SN…</div>
      <div style="display:flex;gap:8px;margin-top:8px;align-items:center"><button type="button" class="btn" id="camTorch" data-a="camTorch" hidden>🔦 Senter</button><span style="flex:1"></span><button type="button" class="btn pri" data-a="camClose">Selesai</button></div>
    </div>`;
  document.body.append(ov);CAM={ov,last:"",t:0};
  try{
    let det=null;
    if("BarcodeDetector" in window){
      try{
        const fm=await BarcodeDetector.getSupportedFormats();
        const want=["code_128","code_39","code_93","ean_13","ean_8","upc_a","upc_e","itf","codabar","qr_code","data_matrix","pdf417"].filter(f=>fm.includes(f));
        if(want.length)det=new BarcodeDetector({formats:want});
      }catch{}
    }
    if(det){
      const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"},width:{ideal:1280},height:{ideal:720}},audio:false});
      if(!CAM){stream.getTracks().forEach(t=>t.stop());return}
      const v=document.createElement("video");v.setAttribute("playsinline","");v.muted=true;v.srcObject=stream;
      v.style.cssText="width:100%;height:100%;object-fit:cover";
      const fr=document.createElement("div");
      fr.style.cssText="position:absolute;left:8%;right:8%;top:38%;height:24%;border:2px solid #4ade80;border-radius:10px;box-shadow:0 0 0 100vmax rgba(0,0,0,.35);pointer-events:none";
      $("#camBox").append(v,fr);await v.play();
      const tr=stream.getVideoTracks()[0];
      if(tr.getCapabilities?.().torch){$("#camTorch").hidden=false;CAM.torch=tr}
      let alive=true;CAM.stop=()=>{alive=false;stream.getTracks().forEach(t=>t.stop())};
      const loop=async()=>{
        if(!alive)return;
        try{if(v.readyState>=2)for(const c of await det.detect(v))camHit(c.rawValue)}catch{}
        if(alive)setTimeout(loop,150);
      };
      loop();
    }else{
      if(!window.Html5Qrcode)await loadScript("https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js");
      if(!CAM)return;
      const h=new Html5Qrcode("camBox",{verbose:false,useBarCodeDetectorIfSupported:true});
      await h.start({facingMode:"environment"},{fps:10,qrbox:{width:280,height:140}},t=>camHit(t),()=>{});
      const stop=()=>h.stop().then(()=>h.clear()).catch(()=>{});
      if(!CAM)return stop();
      CAM.stop=stop;
    }
  }catch(e){
    camClose();
    toast(e.name==="NotAllowedError"?"Izin kamera ditolak. Aktifkan izin kamera di pengaturan browser":"Kamera gagal dibuka: "+e.message,true);
  }
}

const stockAt=(id,wh)=>S.stock.find(s=>s.itemId===id&&s.whId===wh)?.qty||0;
const parseSns=raw=>[...new Set(String(raw||"").split(/[\n,;]+/).map(normSn).filter(Boolean))];
function updManual(){
  const sel=$("#manItem"),f=$("#trx");if(!sel||!f)return;
  const it=IM[sel.value];if(!it)return;
  const isIn=f.dataset.type==="in",hasSn=it.sn!==false,q=$("#manQty");

  else if(hasSn)t+=isIn?" · Tanpa SN: jumlah bertambah, tapi SN tidak tercatat":" · Tanpa SN: jumlah berkurang, tapi status SN di sistem tidak berubah";
  $("#manInfo").innerHTML=t;
}
async function addManual(){
  const f=$("#trx"),type=f.dataset.type,isIn=type==="in",it=IM[$("#manItem").value];
  if(!it)return toast("Pilih barang",true);
  const sns=it.sn!==false?parseSns($("#manSn").value):[];
  if(sns.length){
    let ok=0;const fail=[],msgs=[];
    for(const sn of sns){
      try{const r=await addSn(sn,it);if(r.ok)ok++;else{fail.push(sn);msgs.push(r.msg)}}
      catch(e){fail.push(sn);msgs.push(e.message)}
    }
    $("#manSn").value=fail.join("\n");$("#manQty").value=1;
    drawTrx();
    if(ok)toast(`${nf(ok)} SN ditambahkan ke ${it.name}`);
    if(msgs.length){toast(msgs.slice(0,3).join(" · ")+(msgs.length>3?` (+${msgs.length-3} lainnya)`:""),true);beep(false)}
    return;
  }
  if(f.dataset.mode==="transfer"&&it.sn!==false)return toast("Barang wajib SN: scan atau ketik SN-nya supaya SN ikut pindah gudang",true);
  const qty=parseInt($("#manQty").value,10);
  if(!(qty>0))return toast("Isi qty minimal 1",true);
  if(isIn){const lim=poLimit(it.id,qty);if(lim)return toast(lim,true)}
  else{
    const have=stockAt(it.id,f.wh.value),used=trxQty(it.id);
    if(qty+used>have)return toast(`Stok ${it.name} di gudang ini hanya ${nf(have)}`+(used?` (sudah ${nf(used)} di daftar)`:""),true);
  }
  ensurePrice(it.id,type);
  const ex=TRX.plain.find(x=>x.itemId===it.id);ex?ex.qty+=qty:TRX.plain.push({itemId:it.id,qty});
  $("#manQty").value=1;drawTrx();
}
async function submitTransfer(f){

/* ============================ CUSTOMER & SUPPLIER (master mitra) ============================
   Satu koleksi "partners": tipe customer / supplier / both. Form transaksi memilih dari daftar ini (nama dikanonkan,
   mirip nama lama dicek dulu) sehingga tidak dobel/salah ketik, dan riwayat per mitra bisa dilihat. */
const TYPE_LBL={customer:"customer",supplier:"supplier",both:"customer & supplier"};
const TYPE_CHIP={customer:["Customer","c-ok"],supplier:["Supplier","c-out"],both:["Customer & Supplier","c-gray"]};
const pNorm=x=>String(x||"").toLowerCase().replace(/\b(pt|cv|ud|pd|tbk|toko)\b/g," ").replace(/[^a-z0-9]/g,"");
function lev(a,b){
  if(a===b)return 0;if(!a.length)return b.length;if(!b.length)return a.length;
  let prev=[...Array(b.length+1).keys()];
  for(let i=1;i<=a.length;i++){const cur=[i];for(let j=1;j<=b.length;j++)cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));prev=cur}
  return prev[b.length];
}
const partnersOf=k=>S.partners.filter(p=>p.active!==false&&(p.type===k||p.type==="both"));
const canAddPartner=()=>can("mitra")||can("keluar")||can("masuk");
const partnerDl=(id,kind)=>`<datalist id="${id}">${partnersOf(kind).map(p=>`<option value="${esc(p.name)}"></option>`).join("")}</datalist>`;
const partnerFor=(id,name)=>S.partners.find(p=>id&&p.id===id)||S.partners.find(p=>name&&pNorm(p.name)===pNorm(name))||null;
/* o.create=true: nama baru boleh ditambahkan ke master (staf yang berhak). Tanpa create: hanya dikanonkan ke nama master bila cocok. */
async function resolvePartner(kind,raw,o={}){
  const name=String(raw||"").trim().replace(/\s+/g," ");
  if(!name)return{id:"",name:""};
  const n=pNorm(name)||name.toLowerCase(),canMk=o.create&&canAddPartner();
  const same=S.partners.find(p=>(pNorm(p.name)||p.name.toLowerCase())===n);
  if(same){
    if(canMk&&same.active===false){await store.set("partners",same.id,{active:true});same.active=true}
    if(canMk&&same.type!==kind&&same.type!=="both"&&confirm(`"${same.name}" sudah ada sebagai ${TYPE_LBL[same.type]}. Jadikan juga ${TYPE_LBL[kind]}?`)){await store.set("partners",same.id,{type:"both"});same.type="both"}
    return{id:same.id,name:same.name};
  }
  const near=partnersOf(kind).map(p=>({p,d:lev(pNorm(p.name),n)})).filter(x=>x.d<=Math.max(1,Math.floor(n.length*.2))).sort((a,b)=>a.d-b.d)[0];
  if(near&&confirm(`"${name}" mirip dengan "${near.p.name}" di master.\n\nOK = pakai "${near.p.name}"\nBatal = tetap pakai "${name}" sebagai nama baru`))return{id:near.p.id,name:near.p.name};
  if(canMk){
    if(!confirm(`"${name}" belum ada di master ${TYPE_LBL[kind]}. Tambahkan sekarang?`))throw new Error(`Pilih ${TYPE_LBL[kind]} dari daftar, atau tambahkan lewat tombol + Baru`);
    const rec={name,type:kind,pic:"",phone:"",email:"",address:"",note:"",active:true,createdAt:Date.now(),by:S.user.name};
    const id=await store.add("partners",rec);S.partners.push({id,...rec});S.partners.sort(byName);
    return{id,name};
  }
  return{id:"",name};
}

const IMP={k:"",raw:[],out:[]};
const hk=s=>String(s||"").toLowerCase().replace(/[^a-z0-9]/g,"");
const numImp=s=>num(String(s??"").trim().replace(/[.,]\d{1,2}$/,""));   // "1.200.000,00" -> 1200000
const SPEC_ITEM={kode:["kode","sku","kodebarang","kodesku"],nama:["nama","namabarang"],model:["model","modelpabrik"],brand:["brand","merek"],sn:["wajibsn","wajibscansn","pakaisn"],satuan:["satuan","unit"],min:["stokmin","stokminimum","min"]};
const SPEC_STOCK={kode:["kode","sku","kodebarang","kodesku"],gudang:["gudang","kodegudang","warehouse"],qty:["qty","jumlah","stok"],sn:["sn","serial","serialnumber","nomorserial","barcode","isibarcode"]};
function parseCsv(t){
  t=t.replace(/^﻿/,"");
  const first=t.split(/\r?\n/)[0]||"",cnt=c=>first.split(c).length-1;
  const sep=cnt(";")>cnt(",")&&cnt(";")>=cnt("\t")?";":cnt("\t")>cnt(",")?"\t":",";
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<t.length;i++){
    const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===sep){row.push(cur);cur=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&t[i+1]==="\n")i++;row.push(cur);cur="";rows.push(row);row=[]}
    else cur+=c;
  }
  if(cur!==""||row.length){row.push(cur);rows.push(row)}
  return rows.filter(r=>r.some(x=>String(x).trim()));
}
function tplDownload(name,rows){
  const t=rows.map(r=>r.map(v=>`"${String(v).replace(/"/g,'""')}"`).join(";")).join("\r\n");
  const a=document.createElement("a");a.href=URL.createObjectURL(new Blob(["﻿"+t],{type:"text/csv"}));a.download=name+".csv";a.click();URL.revokeObjectURL(a.href);
}

  else tplDownload("template-stok-awal",[["Kode","Gudang","Qty","SN"],
    ["CONTOH-001","GD-01","","C10000001"],["CONTOH-001","GD-01","","C10000002"],["CONTOH-002","GD-01","20",""]]);
}
function impOpen(k){
  IMP.k=k;IMP.raw=[];IMP.out=[];
  const isItem=k==="item";
  showDlg(`<h3>${isItem?"Import Master Barang":"Import Stok Awal"}</h3>
   <div class="hint" style="line-height:1.6">${isItem
     ?"Kolom: <b>Kode, Nama</b> (wajib) · Model, Brand, Wajib SN (Ya/Tidak, kosong = Ya), Satuan, Stok Min."
     :"Kolom: <b>Kode</b> (harus sudah ada di Master Barang), <b>Gudang</b> (kode atau nama gudang), Qty, SN.<br>Barang <b>wajib SN</b>: 1 baris = 1 SN (kolom Qty diabaikan). Barang <b>tanpa SN</b>: isi Qty, kolom SN kosong.<br>Stok dicatat sebagai Barang Masuk \"Stok Awal (Import)\" dan ikut ke nilai aset/HPP. Import 2× = stok bertambah 2×."}
   <br>Cara dari Excel: <b>Save As → CSV</b>. Hapus baris contoh (CONTOH-…) dari template.</div>
   <div class="filters" style="margin:14px 0 10px"><button class="btn" data-a="impTpl" data-k="${k}">⬇ Download Template</button>
   <label style="max-width:300px"><input type="file" id="impFile" accept=".csv,.txt,text/csv"></label>
   ${isItem?`<label style="max-width:240px">Jika kode sudah ada<select id="impMode"><option value="skip">Lewati</option><option value="update">Update data</option></select></label>`:""}</div>
   <div id="impPrev"><div class="empty">Pilih file CSV untuk melihat pratinjau</div></div>
   <p class="err" id="impMsg"></p>
   <div class="right"><button class="btn" data-a="closeDlg">Tutup</button><button class="btn pri" id="impGo" data-a="impGo" disabled>Import</button></div>`,true);
}
async function impLoad(file){
  if(!file)return;
  const rows=parseCsv(await file.text());
  if(rows.length<2){IMP.raw=[];IMP.out=[];return impPreview("File kosong atau hanya berisi header")}
  const spec=IMP.k==="item"?SPEC_ITEM:SPEC_STOCK,head=rows[0].map(hk),ix={};
  for(const f in spec)ix[f]=head.findIndex(h=>spec[f].includes(h));
  const need=IMP.k==="item"?["kode","nama"]:["kode","gudang"],miss=need.filter(f=>ix[f]<0);
  if(miss.length){IMP.raw=[];IMP.out=[];return impPreview("Kolom wajib tidak ditemukan: "+miss.join(", ")+". Pakai template.")}
  IMP.raw=rows.slice(1).map((r,i)=>{const o={};for(const f in ix)o[f]=ix[f]>=0?String(r[ix[f]]??"").trim():"";return{n:i+2,o}});
  IMP.k==="item"?prepItems():prepStock();
  impPreview();
}
function prepItems(){
  const mode=$("#impMode")?.value||"skip",seen=new Set(),codes=Object.fromEntries(S.items.map(i=>[i.code.toLowerCase(),i]));
  IMP.out=IMP.raw.map(({n,o})=>{
    const k=o.kode.toLowerCase();
    if(!o.kode||!o.nama)return{n,o,act:"error",msg:"Kode & nama wajib diisi"};
    if(seen.has(k))return{n,o,act:"error",msg:"Kode dobel di file"};seen.add(k);
    const sn=!["tidak","t","no","n","0","false","non"].includes(o.sn.toLowerCase());
    const data={code:o.kode,name:o.nama,model:o.model.toUpperCase(),brand:o.brand,sn,unit:o.satuan||"pcs",min:numImp(o.min)};
    const ex=codes[k];
    if(!ex)return{n,o,data,act:"new"};
    const upd={name:o.nama};
    if(o.model)upd.model=data.model;if(o.brand)upd.brand=o.brand;if(o.sn)upd.sn=sn;if(o.satuan)upd.unit=o.satuan;
    if(o.min)upd.min=data.min;
    return{n,o,data,upd,id:ex.id,act:mode==="update"?"update":"skip"};
  });
}
function prepStock(){
  const wm={};S.whs.forEach(w=>{wm[w.code.toLowerCase()]=w;wm[w.name.toLowerCase()]=w});
  const im=Object.fromEntries(S.items.map(i=>[i.code.toLowerCase(),i])),seenSn=new Set();
  IMP.out=IMP.raw.map(({n,o})=>{
    const er=msg=>({n,o,act:"error",msg}),it=im[o.kode.toLowerCase()],w=wm[o.gudang.toLowerCase()];
    if(!it)return er("Kode barang belum ada di Master Barang");
    if(!w)return er("Gudang tidak ditemukan (isi kode/nama gudang persis)");
    const cost=it.cost||0;
    if(it.sn!==false){
      const sn=normSn(o.sn);
      if(!sn)return er("Barang wajib SN: isi kolom SN (1 baris = 1 SN)");
      if(seenSn.has(sn))return er("SN dobel di file");
      seenSn.add(sn);return{n,o,it,w,cost,qty:1,sn,act:"ok"};
    }
    const qty=numImp(o.qty);
    if(!(qty>0))return er("Qty harus lebih dari 0");
    if(o.sn)return er("Barang tanpa SN: kolom SN harus kosong");
    return{n,o,it,w,cost,qty,sn:"",act:"ok"};
  });
}
function impPreview(msg){

    }</tbody></table></div><div class="hint" style="margin-top:6px">Baris error tidak ikut diimport.${o.length>200?" Menampilkan 200 baris pertama.":""}</div>`;
  go.disabled=!good.length;
  go.textContent=good.length?(isItem?`Import ${nf(good.length)} barang`:`Import ${nf(good.length)} baris stok`):"Tidak ada yang bisa diimport";
}
async function impGo(b){
  const msg=$("#impMsg");b.disabled=true;msg.textContent="";
  try{
    if(IMP.k==="item"){
      const nw=IMP.out.filter(x=>x.act==="new"),up=IMP.out.filter(x=>x.act==="update");
      msg.textContent="Menyimpan…";
      if(nw.length)await store.addMany("items",nw.map(x=>x.data));
      for(const x of up)await store.set("items",x.id,x.upd);
      await refresh();$("#dlg").close();toast(`${nw.length} barang baru, ${up.length} diperbarui`);
    }else await importStock();
  }catch(e){msg.textContent=e.message;b.disabled=false}
}
async function importStock(){
  const ok=IMP.out.filter(x=>x.act==="ok"),msg=$("#impMsg"),byW={};
  ok.forEach(x=>{
    const wg=byW[x.w.id]=byW[x.w.id]||{w:x.w,g:{}},k=x.it.id+"|"+x.cost,g=wg.g[k]=wg.g[k]||{it:x.it,cost:x.cost,qty:0,sns:[]};
    x.sn?g.sns.push(x.sn):g.qty+=x.qty;
  });
  const docs=[];
  Object.values(byW).forEach(({w,g})=>{
    let cur=null;
    const push=l=>{const n=(l.sns||[]).length;if(!cur||cur.sn+n>400||cur.lines.length>=25){cur={w,lines:[],sn:0};docs.push(cur)}cur.lines.push(l);cur.sn+=n};
    Object.values(g).forEach(x=>{
      const base={type:"in",itemId:x.it.id,itemCode:x.it.code,itemName:x.it.name,whId:w.id,whName:w.name,fb:x.it.cost||0,unitCost:x.cost};
      if(x.sns.length){for(let i=0;i<x.sns.length;i+=400){const s=x.sns.slice(i,i+400);push({...base,qty:s.length,sns:s})}}
      else push({...base,qty:x.qty});
    });
  });
  let done=0;
  for(const d of docs){
    msg.textContent=`Memproses dokumen ${done+1} dari ${docs.length}…`;
    const date=todayStr(),meta={type:"in",date,docNo:`IN-${date.replace(/-/g,"")}-${rid().slice(0,4).toUpperCase()}`,party:"Stok Awal (Import)",ref:"",note:"Import stok awal dari CSV",by:S.user.id,byName:S.user.name,poId:"",poNo:""};
    try{await store.post(d.lines,meta,{})}
    catch(e){await refresh();throw new Error(`Gagal di dokumen ${done+1} dari ${docs.length} (${d.w.name}): ${e.message}.${done?` ${done} dokumen sebelumnya SUDAH masuk — hapus baris yang sudah masuk dari file sebelum import ulang.`:""}`)}
    done++;
  }
  await refresh();$("#dlg").close();toast(`Stok awal tersimpan: ${nf(ok.reduce((a,x)=>a+x.qty,0))} unit dalam ${docs.length} dokumen`);
}

async function opScan(){
  if(!OP)return toast("Mulai opname dulu",true);
  const inp=$("#opscan"),sn=normSn(inp.value);inp.value="";if(!sn)return;
  const say=(m,ok)=>{const e=$("#opMsg");if(e){e.textContent=m;e.className="scanmsg "+(ok?"ok":"bad")}beep(ok)};
  const sh=shortSn(sn);
  try{
    if([...OP.rows.values()].some(r=>r.scan.has(sn))||OP.extras.has(sn))return say(`SN ${sh} sudah discan`);
    const ex=await store.getSerial(sid(sn));
    if(ex){
      if(ex.status==="in"&&ex.whId===OP.whId&&IM[ex.itemId]){const r=opRow(ex.itemId);r.scan.add(sn);r.counted=true;say(`✓ ${sh} → ${ex.itemName}`,true)}
      else{
        const m=ex.status==="in"?`SN ${sh} tercatat di ${ex.whName}, bukan di ${OP.whName}. Gunakan Pindah Gudang.`:`SN ${sh} tercatat sudah keluar (${ex.outDoc||"-"}) tetapi fisiknya ada. Cek dulu riwayatnya.`;
        if(!OP.conf.some(c=>c.sn===sn))OP.conf.push({sn,msg:m});say(m);
      }
    }else{
      const it=detectItem(sn);
      if(!it){const m=`SN ${sh} belum terdaftar dan barangnya tidak terdeteksi dari barcode. Catat lewat Barang Masuk.`;if(!OP.conf.some(c=>c.sn===sn))OP.conf.push({sn,msg:m});say(m)}

async function opReview(){
  if(!OP)return;
  const counted=[...OP.rows.values()].filter(r=>IM[r.itemId]&&opCounted(r));
  if(!counted.length)return toast("Belum ada barang yang dihitung",true);
  const fresh=await store.list("stock"),fq=id=>fresh.find(x=>x.itemId===id&&x.whId===OP.whId)?.qty||0;
  const chg=counted.filter(r=>fq(r.itemId)!==r.sys);
  if(chg.length){chg.forEach(r=>r.sys=fq(r.itemId));drawOpRows();return toast(`Stok sistem berubah sejak opname dimulai: ${chg.map(r=>IM[r.itemId].name).join(", ")}. Angka Sistem sudah diperbarui, cek lalu Tinjau lagi.`,true)}
  const plan=[];
  for(const r of counted){
    const it=IM[r.itemId],rec=fresh.find(x=>x.itemId===r.itemId&&x.whId===OP.whId),unit=rec&&rec.qty>0?rec.value/rec.qty:(Number(it.cost)||0);
    if(r.sn){
      const ids=new Set([...r.scan].map(sid)),sys=(await store.list("serials",["itemId",r.itemId])).filter(x=>x.status==="in"&&x.whId===OP.whId);
      const missing=sys.filter(x=>!ids.has(x.id)),extras=opExtras(r.itemId);
      plan.push({r,it,unit,sys:r.sys,phys:r.scan.size+extras.length,missing,extras,diff:extras.length-missing.length,warn:sys.length!==r.sys?`Jumlah SN tercatat (${sys.length}) tidak sama dengan qty stok (${r.sys}). Selisih mengikuti SN.`:""});
    }else{
      const phys=parseInt(r.phys,10)||0;
      plan.push({r,it,unit,sys:r.sys,phys,missing:[],extras:[],diff:phys-r.sys,warn:""});
    }
  }
  const plus=plan.reduce((a,p)=>a+Math.max(0,p.diff),0),minus=plan.reduce((a,p)=>a+Math.max(0,-p.diff),0);
  const act=p=>{
    if(p.r.sn){const t=[];if(p.missing.length)t.push(`Hilang ${p.missing.length}: ${p.missing.slice(0,8).map(x=>esc(x.short||shortSn(x.sn))).join(", ")}${p.missing.length>8?" …":""}`);
      if(p.extras.length)t.push(`Lebih ${p.extras.length} (masuk stok): ${p.extras.slice(0,8).map(x=>esc(x.short)).join(", ")}${p.extras.length>8?" …":""}`);return t.join("<br>")||"Sesuai"}
    return p.diff===0?"Sesuai":`Stok ${opSign(p.diff)}`;
  };
  modal("Tinjau Hasil Opname",`<div class="f"><div class="hint">Gudang <b>${esc(OP.whName)}</b> · ${nf(plan.length)} barang dihitung · koreksi total <b style="color:var(--ok)">+${nf(plus)}</b> / <b style="color:var(--bad)">−${nf(minus)}</b> unit${plus||minus?"":" (semua sesuai, hasil tetap dicatat)"}</div>
    <div class="tw"><table><thead><tr><th>Barang</th><th class="num">Sistem</th><th class="num">Fisik</th><th class="num">Selisih</th><th>Tindakan</th></tr></thead><tbody>${plan.map(p=>`<tr><td>${esc(p.it.name)}<div class="hint">${esc(p.it.code)}</div>${p.warn?`<div class="hint" style="color:var(--warn)">${esc(p.warn)}</div>`:""}</td><td class="num">${nf(p.sys)}</td><td class="num">${nf(p.phys)}</td><td class="num"><b>${p.diff===0?"0":opSign(p.diff)}</b></td><td>${act(p)}</td></tr>`).join("")}</tbody></table></div>
    <label>Alasan / catatan opname<textarea name="note" required placeholder="Misal: opname rutin akhir bulan"></textarea></label>
    <div class="hint">Saat disimpan, stok dikoreksi sesuai selisih dan tercatat di Riwayat Transaksi sebagai Opname +/−. Barang yang belum dihitung tidak berubah.</div></div>`,
  d=>opApply(plan,(d.note||"").trim(),fresh,plus,minus),true);
}
async function opApply(plan,note,fresh,plus,minus){
  if(!note)throw new Error("Isi alasan / catatan opname");
  const wh=WM[OP.whId],date=todayStr(),docNo="OPN-"+date.replace(/-/g,"")+"-"+rid().slice(0,4).toUpperCase(),lines=[];
  plan.forEach(p=>{
    const b={itemId:p.it.id,itemCode:p.it.code,itemName:p.it.name,whId:wh.id,whName:wh.name,fb:Number(p.it.cost)||0};
    if(p.r.sn){
      if(p.missing.length)lines.push({...b,type:"out",qty:p.missing.length,sns:p.missing.map(x=>x.sn),price:0});
      if(p.extras.length)lines.push({...b,type:"in",qty:p.extras.length,sns:p.extras.map(x=>x.sn),unitCost:p.unit});
    }else if(p.diff>0)lines.push({...b,type:"in",qty:p.diff,sns:[],unitCost:p.unit});
    else if(p.diff<0)lines.push({...b,type:"out",qty:-p.diff,sns:[],price:0});
  });
  if(lines.length)await store.post(lines,{type:"adj",adj:true,opname:true,date,docNo,ref:"",note,party:"Penyesuaian Stok Opname",by:S.user.id,byName:S.user.name,poId:"",poNo:""});
  const rec={no:docNo,date,whId:wh.id,whName:wh.name,note,by:S.user.id,byName:S.user.name,createdAt:Date.now(),plus,minus,
    rows:plan.map(p=>({itemId:p.it.id,code:p.it.code,name:p.it.name,sn:p.r.sn,sys:p.sys,phys:p.phys,diff:p.diff,missing:p.missing.map(x=>x.short||shortSn(x.sn)),extra:p.extras.map(x=>x.short)}))};
  try{await store.add("opnames",rec)}catch(x){toast("Stok sudah dikoreksi, tetapi catatan opname gagal disimpan: "+x.message,true)}
  OP=null;await refresh();toast(`${docNo} tersimpan. Stok dikoreksi (+${nf(plus)} / −${nf(minus)})`);
}

/* ============================ GARANSI & RMA ============================

const RMA_ST={received:["Diterima dari customer","c-warn"],sent:["Dikirim ke distributor","c-out"],replaced:["Diganti unit baru","c-in"],returned:["Kembali (sudah diperbaiki)","c-ok"],rejected:["Ditolak","c-bad"]};

function warrantyOf(sr){

}

async function bdLogoLoad(file,key="logo"){
  if(!file)return;
  if(!/^image\//.test(file.type))throw new Error("File harus berupa gambar");
  if(file.size>5*1024*1024)throw new Error("Ukuran gambar maksimal 5 MB");
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=()=>no(new Error("Gambar tidak bisa dibaca"));i.src=url});
    const lg=key==="logo";let max=lg?360:640,out="";
    for(let n=0;n<3;n++){
      const w0=img.naturalWidth||max,h0=img.naturalHeight||max,k=Math.min(1,max/Math.max(w0,h0));
      const c=document.createElement("canvas");c.width=Math.max(1,Math.round(w0*k));c.height=Math.max(1,Math.round(h0*k));
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      out=c.toDataURL("image/webp",.9);if(!out.startsWith("data:image/webp"))out=c.toDataURL("image/png");
      if(out.length<(lg?400000:250000))break;max=Math.round(max*.65);
    }
    if(out.length>(lg?700000:350000))throw new Error("Logo terlalu besar, pakai gambar yang lebih kecil");
    bdSet(key,out);
  }finally{URL.revokeObjectURL(url)}
}
async function bdSave(){
  const d=S.draft;if(!d)return;
  const out={brandName:(d.brandName||"").trim(),tagline:(d.tagline||"").trim(),logo:d.logo||"",loginLogo:d.loginLogo||"",loginLogoMode:["asli","putih","kartu"].includes(d.loginLogoMode)?d.loginLogoMode:"asli",theme:d.theme||"custom",pri:hexOk(d.pri)?d.pri:BRAND_DEF.pri,side:hexOk(d.side)?d.side:BRAND_DEF.side,mode:d.mode==="dark"?"dark":"light",showBanner:d.showBanner!==false,logoPlate:d.logoPlate!==false,updatedAt:Date.now()};
  if(JSON.stringify(out).length>900000)throw new Error("Total ukuran logo terlalu besar (batas dokumen Firestore ±1 MB). Pakai gambar yang lebih kecil");
  await store.saveBranding(out);
  const cn=(d.companyName||"").trim()||"NauVision";
  const ca=(d.companyAddr||"").trim(),cp=(d.companyPhone||"").trim();
  if(cn!==S.settings.companyName||ca!==(S.settings.companyAddr||"")||cp!==(S.settings.companyPhone||"")){await store.saveSettings({companyName:cn,companyAddr:ca,companyPhone:cp});Object.assign(S.settings,{companyName:cn,companyAddr:ca,companyPhone:cp})}

function notifs(){
  const u=S.user;if(!u)return[];
  const L=[],adm=u.role==="admin",recent=Date.now()-14*864e5;
  S.rents.forEach(r=>{
    const st=rentSt(r);
    if(adm){
      if(st==="pend")L.push({id:"rent-p-"+r.id,t:"Pengajuan rent baru",d:`${r.salesName} · ${r.itemName} ×${nf(r.qty)}`,go:"rent",ts:nfTs(r.createdAt)});
      else if(st==="late")L.push({id:"rent-late-"+r.id,t:"Rent melewati jatuh tempo",d:`${r.salesName} · ${r.itemName} (sampai ${r.end})`,go:"rent",ts:nfTs(r.end)});
    }else{
      const ts=nfTs(r.approvedAt)||nfTs(r.createdAt);
      if(st==="late")L.push({id:"rent-late-"+r.id,t:"Rent melewati jatuh tempo",d:`${r.itemName} (sampai ${r.end}), segera kembalikan`,go:"rent",ts:nfTs(r.end)});
      else if(st==="run"&&ts>recent)L.push({id:"rent-ok-"+r.id,t:"Rent disetujui",d:`${r.itemName} ×${nf(r.qty)} · ${r.start} s/d ${r.end}`,go:"rent",ts});
      else if(st==="rej"&&ts>recent)L.push({id:"rent-rej-"+r.id,t:"Rent ditolak",d:`${r.itemName}${r.rejectNote?" · "+r.rejectNote:""}`,go:"rent",ts});
    }
  });
  S.orders.forEach(o=>{
    const ts=nfTs(o.approvedAt)||nfTs(o.createdAt);
    if(adm){
      if(o.status==="pending")L.push({id:"ord-p-"+o.id,t:"Order baru menunggu approval",d:`${o.salesName} · ${o.customer}`,go:"order",ts:nfTs(o.createdAt)});
    }else if(ts>recent){
      if(o.status==="approved")L.push({id:"ord-ok-"+o.id,t:"Order disetujui",d:`${o.no} · ${o.customer}`,go:"order",ts});
      else if(o.status==="rejected")L.push({id:"ord-rej-"+o.id,t:"Order ditolak",d:`${o.no} · ${o.customer}${o.rejectNote?" · "+o.rejectNote:""}`,go:"order",ts});
    }
  });
  if(u.role==="admin"||u.role==="gudang"){
    const low=mergedRows().filter(r=>r.st!=="aman");
    if(low.length){
      const hb=low.filter(r=>r.st==="habis").length;
      L.push({id:"low-"+low.map(r=>r.it.id).sort().join(","),t:`${nf(low.length)} barang stok menipis / habis`,d:low.slice(0,3).map(r=>r.it.name).join(", ")+(low.length>3?` +${low.length-3} lainnya`:"")+(hb?` · ${nf(hb)} habis`:""),go:"stok",ts:Date.now()});
    }
  }
  return L;
}
function drawBell(){
  const box=$("#nf");if(!box||!S.user)return;
  const all=notifs(),ids=new Set(all.map(x=>x.id)),rd0=nfRead(),rd=new Set([...rd0].filter(x=>ids.has(x)));
  if(rd.size!==rd0.size)nfSave(rd);
  all.sort((a,b)=>(rd.has(a.id)-rd.has(b.id))||b.ts-a.ts);
  NF_LIST=all;
  const un=all.filter(x=>!rd.has(x.id)).length,c=$("#nfc");
  c.hidden=!un;c.textContent=un>99?"99+":un;
  $("#nfBtn").title=un?`${un} notifikasi baru`:"Notifikasi";
  $("#nfAll").hidden=!un;
  $("#nfl").innerHTML=all.length?all.slice(0,30).map((x,i)=>`<button type="button" class="nfi ${rd.has(x.id)?"rd":""}" data-a="nfGo" data-i="${i}"><span class="dot"></span><span><b>${esc(x.t)}</b><span class="d">${esc(x.d)}</span>${x.ts?`<small>${new Date(x.ts).toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"})}</small>`:""}</span></button>`).join(""):'<div class="empty">Belum ada notifikasi</div>';
}
/* cek order/rent baru tiap 60 detik (tanpa reload halaman) */
async function pollNotif(){
  if(!S.user||document.hidden)return;
  const w=S.user.role==="admin"?null:["salesId",S.user.id];
  try{
    const [r,o]=await Promise.all([store.list("rentals",w),store.list("orders",w)]);
    r.sort((a,b)=>String(b.start||"").localeCompare(String(a.start||"")));o.sort(byNew);
    const sig=a=>JSON.stringify(a.map(x=>[x.id,x.status,x.returnedAt||""]));
    if(sig(r)===sig(S.rents)&&sig(o)===sig(S.orders))return;
    const before=new Set(notifs().map(x=>x.id));
    S.rents=r;S.orders=o;
    const rd=nfRead(),fresh=notifs().filter(x=>!before.has(x.id)&&!rd.has(x.id));
    drawBell();
    if(!$("#dlg").open){
      if(S.view==="rent"||S.view==="order")T[S.view]();
      else if(S.view==="dashboard")$("#view").innerHTML=V.dashboard();
    }
    fresh.slice(0,3).forEach(x=>toast("🔔 "+x.t+" · "+x.d));
  }catch{}
}
setInterval(pollNotif,60000);

  const n=new Date(),z=v=>String(v).padStart(2,"0");

function render(){
  let v=location.hash.replace("#/","")||"dashboard";
  if(!MENUS[v]||!can(v))v="dashboard";
  if(v!=="tampilan"&&S.draft){S.draft=null;applyBrand(S.brand)}
  const vchg=S.view!==v;S.view=v;$("#title").textContent=MENUS[v].t;
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.dataset.nav===v));
  $("#view").innerHTML=V[v]();T[v]?.();if(vchg)$("#view").scrollTop=0;
  if(v==="masuk"||v==="keluar"||v==="transfer"){
    resetTrx();
    if(v==="masuk"&&S.pendingPo&&S.pos.some(p=>p.id===S.pendingPo&&poOpen(p)))poSelect(S.pendingPo);else drawTrx();
    S.pendingPo=null;$("#scan")?.focus();
  }
  if(v==="sn")$("#snq")?.focus();
  drawBell();
  $("#side").classList.remove("open");
}

  if(e.key!=="Enter")return;
  if(e.target.id==="scan"){e.preventDefault();onScan(e.target)}
  else if(e.target.id==="manQty"){e.preventDefault();addManual()}
  else if(e.target.id==="snq"){e.preventDefault();snFind()}
  else if(e.target.id==="gq"){e.preventDefault();gFind()}
  else if(e.target.id==="opscan"){e.preventDefault();opScan()}
  else if(e.target.closest?.(".filters")&&S.view==="stok"&&e.target.tagName==="INPUT"){e.preventDefault();A.stQuery()}
  else if(e.target.closest?.("#trx")&&e.target.tagName==="INPUT"&&e.target.type!=="checkbox")e.preventDefault(); // cegah Enter tidak sengaja menyimpan dokumen
});

/* ============================ LOGIN ============================ */
const errMsg=e=>/invalid-credential|wrong-password|user-not-found|invalid-email/.test(e.code||"")?"Email atau password salah":/too-many/.test(e.code||"")?"Terlalu banyak percobaan, coba lagi nanti":e.message;
function showLogin(){
  $("#shell").hidden=true;$("#login").hidden=false;$("#lerr").textContent="";capNew();const _pi=$("#loginForm").password,_pb=$(".pwb");if(_pi.type!=="password")_pb.click();
  $("#demoBox").hidden=false;
  $("#demoBox").className=USE_FB?"demo demo2":"demo";
  if(USE_FB)$("#demoBox").innerHTML=`<div class="dmsep"><small>atau coba dulu</small></div><div class="dmb">`+[["admin","Admin"],["gudang","Staf Gudang"],["sales","Sales"]].map(([r,l])=>`<button type="button" class="btn dm" data-demo="${r}">${l}</button>`).join("")+`</div><div class="dmn">Akun demo berisi data contoh. Tidak mengubah data asli dan hilang saat Anda keluar.</div>`;
  else $("#demoBox").innerHTML=`<b>Akun demo (klik untuk isi otomatis)</b>`+[["admin@demo.local","admin123","Admin"],["gudang@demo.local","gudang123","Staf Gudang"],["finance@demo.local","finance123","Keuangan"],["sales@demo.local","sales123","Sales"]].map(([e,p,l])=>`<span data-e="${e}" data-p="${p}">${l}</span>`).join("");
}
$("#demoBox").onclick=e=>{
  const d=e.target.closest("[data-demo]");if(d){enterDemo(d.dataset.demo);return}
  const s=e.target.closest("span[data-e]");if(s){const f=$("#loginForm");f.email.value=s.dataset.e;f.password.value=s.dataset.p}
};
/* Sesi demo publik: store diganti ke data contoh di memori (localStore mem), store asli (Firestore) tidak disentuh sama sekali. */
const DEMO_ACC={admin:["admin@demo.local","admin123"],gudang:["gudang@demo.local","gudang123"],sales:["sales@demo.local","sales123"]};
let REAL_STORE=null,BRAND0=null;
function exitDemo(){
  if(!DEMO)return;
  DEMO=false;if(REAL_STORE)store=REAL_STORE;REAL_STORE=null;
  S.brand=BRAND0||S.brand;BRAND0=null;applyBrand(S.brand);
  $("#demoBar").hidden=true;
}
async function enterDemo(role){
  const bx=$("#demoBox"),bs=[...bx.querySelectorAll("button")],acc=DEMO_ACC[role];
  if(!acc||DEMO)return;
  bs.forEach(b=>b.disabled=true);$("#lerr").textContent="";
  REAL_STORE=store;BRAND0=S.brand;DEMO=true;
  try{
    store=localStore({mem:true});
    await enter(await store.auth.login(acc[0],acc[1]));
    $("#demoBar").hidden=false;
  }catch(x){exitDemo();$("#lerr").textContent="Gagal membuka demo: "+x.message}
  bs.forEach(b=>b.disabled=false);
}
async function enter(u){
  S.user=u;await loadData();buildNav();
  $("#login").hidden=true;$("#shell").hidden=false;render();
  unwatch?.();unwatch=store.watchStock?.(onStock)||null;
}
/* Captcha sederhana (canvas, di sisi browser): pencegah salah-klik & bot sederhana */
let CAPV="";
function capNew(){
  const cv=$("#capCv");if(!cv)return;
  const ch="ABCDEFGHJKLMNPQRSTUVWXYZ23456789",rnd=n=>crypto.getRandomValues(new Uint32Array(1))[0]%n;
  CAPV=Array.from({length:5},()=>ch[rnd(ch.length)]).join("");
  const c=cv.getContext("2d"),W=cv.width,H=cv.height;
  c.clearRect(0,0,W,H);
  const g=c.createLinearGradient(0,0,W,H);g.addColorStop(0,"#eaf1fd");g.addColorStop(1,"#f6f9ff");c.fillStyle=g;c.fillRect(0,0,W,H);
  for(let i=0;i<7;i++){c.strokeStyle=`hsla(${210+rnd(40)},60%,45%,.35)`;c.lineWidth=1+rnd(3)/2;c.beginPath();c.moveTo(rnd(W),rnd(H));c.bezierCurveTo(rnd(W),rnd(H),rnd(W),rnd(H),rnd(W),rnd(H));c.stroke()}
  for(let i=0;i<60;i++){c.fillStyle=`hsla(${200+rnd(60)},50%,40%,.35)`;c.fillRect(rnd(W),rnd(H),2,2)}
  c.textBaseline="middle";c.textAlign="center";
  [...CAPV].forEach((t,i)=>{
    c.save();c.translate(36+i*58+rnd(8)-4,H/2+rnd(14)-7);c.rotate((rnd(50)-25)*Math.PI/180);
    c.font=`bold ${44+rnd(12)}px Arial, sans-serif`;c.fillStyle=`hsl(${205+rnd(35)},70%,${22+rnd(16)}%)`;c.fillText(t,0,0);c.restore();
  });
  for(let i=0;i<3;i++){c.strokeStyle=`hsla(${210+rnd(40)},60%,35%,.5)`;c.lineWidth=2;c.beginPath();c.moveTo(0,rnd(H));c.lineTo(W,rnd(H));c.stroke()}
  const inp=$("#capIn");if(inp)inp.value="";
}
$("#capRef").onclick=()=>{capNew();$("#capIn").focus()};
capNew();
$("#loginForm").onsubmit=async e=>{
  e.preventDefault();$("#lerr").textContent="";const b=e.target.querySelector("button.pri");b.disabled=true;
  try{
    if(String(e.target.captcha.value).trim().toUpperCase()!==CAPV){capNew();throw new Error("Kode keamanan salah, coba lagi")}
    await enter(await store.auth.login(e.target.email.value.trim(),e.target.password.value));
  }
  catch(x){$("#lerr").textContent=errMsg(x);capNew()}b.disabled=false;
};

/* ============================ BOOT ============================ */
(async()=>{
  S.brand=readBrandCache();applyBrand(S.brand);
  try{
    store=USE_FB?await fbStore():localStore();
    store.getBranding().then(b=>{if(b){S.brand=b;cacheBrand(b);if(!S.draft)applyBrand(b);if(S.user&&S.view==="dashboard")render()}}).catch(()=>{});
    const u=await store.auth.restore();
    u?await enter(u):showLogin();
  }catch(e){console.error(e);showLogin();$("#lerr").textContent="Gagal inisialisasi: "+e.message}
})();
</script>
